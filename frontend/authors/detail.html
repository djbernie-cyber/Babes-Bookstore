<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Author — Babe's Bookstore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
</head>
<body class="min-h-screen flex flex-col">
<nav class="sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center h-[68px]">
  <div class="flex items-center gap-8"><a href="/" class="font-serif text-[1.45rem] font-bold tracking-[-.02em]">Babe's<span class="font-normal text-stone-500"> —</span> Bookstore</a>
    <div class="hidden md:flex gap-7 text-[.92rem] font-medium"><a href="/bundles" class="text-stone-600 hover:text-stone-900">Bundles</a><a href="/search" class="text-stone-900">Library</a><a href="/authors" class="text-stone-900">Authors</a></div></div>
  <div class="flex items-center gap-3"><a href="/account" class="hidden sm:inline-flex px-4 py-2 rounded-full border bg-white text-sm font-medium">Account</a>
    <button class="md:hidden p-2 -mr-2" onclick="document.getElementById('m').classList.toggle('hidden')"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
</div></div><div id="m" class="hidden md:hidden border-t bg-white px-4 py-3 space-y-1"><a href="/bundles" class="block px-3 py-2.5 rounded-xl hover:bg-stone-50">Bundles</a><a href="/search" class="block px-3 py-2.5 rounded-xl hover:bg-stone-50">Library</a><a href="/authors" class="block px-3 py-2.5 rounded-xl bg-stone-100 font-medium">Authors</a></div></nav>

<main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 w-full">
  <a href="/authors" class="inline-flex items-center gap-1.5 text-sm text-[#8a8683] hover:text-[#0b0b0c]">← All authors</a>
  <div class="max-w-3xl mt-4">
    <p class="eyebrow" id="author-eyebrow">Author</p>
    <h1 class="font-serif text-4xl sm:text-5xl font-bold tracking-[-.03em] mt-2 leading-[.95]" id="author-title">Loading…</h1>
    <p class="text-stone-600 mt-3 leading-7" id="author-desc"></p>
  </div>

  <div id="meta" class="hidden mt-6 text-sm text-stone-500"></div>
  <button id="african-toggle" onclick="toggleAfrican()" style="display:none" class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full border bg-white text-sm font-medium hover:bg-[#fcfaf7]"><span>🌍</span><span>African Literature works</span></button>
  <div id="loading" class="text-center py-16"><div class="inline-block w-8 h-8 border-4 border-stone-200 border-t-stone-800 rounded-full animate-spin"></div></div>
  <div id="error" class="hidden mt-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm"></div>
  <div id="results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 mt-6"></div>
  <div id="empty" class="hidden text-center py-16"><p class="font-serif text-xl font-bold">No books found</p><p class="text-stone-500 mt-2 text-sm">This author's works haven't been added yet.</p></div>
  <div id="pagination" class="flex justify-center items-center gap-3 mt-10"></div>
</main>

<footer><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center text-sm text-stone-500">© <span data-copyright-year>2026</span> Babe's Bookstore</div></footer>

<script src="/js/store.js"></script>
<script>
function slugFromUrl(){
  var path=location.pathname.replace(/^\/authors\//,'').replace(/\/$/,'');
  return decodeURIComponent(path);
}
function titleFromSlug(s){
  return s.split('-').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1) }).join(' ');
}
var slug=slugFromUrl();
var authorName=titleFromSlug(slug);
document.getElementById('author-title').textContent=authorName;
document.getElementById('author-desc').textContent='Browse the works of '+authorName+' available in the public-domain library.';
document.title=authorName+" — Babe's Bookstore";

  function coverHtml(b){
    if(b.cover_path && /^https?:\/\//.test(b.cover_path)){
      return `<img src="${b.cover_path}" alt="${String(b.title).replace(/"/g,'&quot;')}" class="w-full h-56 object-cover bg-[#f6f1e7]" loading="lazy">`;
    }
    var letter=String(b.title||'?').charAt(0).toUpperCase();
    return `<div class="w-full h-56 bg-[#f6f1e7] border-b flex flex-col items-center justify-center p-4"><span class="font-serif text-5xl text-[#0b0b0c]">${letter}</span><span class="text-[11px] tracking-wide uppercase font-medium text-[#8a8683] mt-2 text-center line-clamp-2">${esc(b.title)}</span></div>`;
  }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function card(b){
    return '<div class="book-card group overflow-hidden flex flex-col">'+
      '<a href="/books/'+b.id+'" class="block">'+coverHtml(b)+'</a>'+
      '<div class="p-4 flex-1 flex flex-col">'+
        '<a href="/books/'+b.id+'" class="font-serif font-semibold leading-tight line-clamp-2 hover:underline">'+esc(b.title)+'</a>'+
        '<p class="text-sm text-[#57534e] mt-1">'+esc(b.author)+'</p>'+
        '<div class="flex flex-wrap gap-1.5 mt-2">'+(b.category?'<span class="text-[11px] px-2 py-1 rounded-full bg-white border text-[#57534e]">'+esc(b.category)+'</span>':'')+(b.publication_year?'<span class="text-xs text-[#8a8683]">'+b.publication_year+'</span>':'')+'</div>'+
        '<div class="mt-3 flex gap-2">'+
          '<a href="/api/v1/books/'+b.id+'/download" class="flex-1 text-center text-xs font-semibold px-3 py-2 rounded-full bg-[#0b0b0c] text-white hover:bg-black">Free download</a>'+
          '<a href="/books/'+b.id+'" class="text-xs font-medium px-3 py-2 rounded-full border bg-white hover:bg-[#fcfaf7]">Preview</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  var curPage=1, activeTag=null, taggedTotal=null;
  async function tagTotal(){
    try{
      var r=await fetch('/api/v1/authors/'+slug+'?page_size=1&tag='+encodeURIComponent('African Literature'));
      if(r.ok){ var d=await r.json(); taggedTotal=d.total; renderTagToggle(); }
    }catch(e){}
  }
  function renderTagToggle(){
    var el=document.getElementById('african-toggle'); if(!el) return;
    if(typeof taggedTotal==='number' && taggedTotal>0){ el.style.display='inline-flex'; }
  }
  async function load(page){
    if(page) curPage=page;
    var loading=document.getElementById('loading'), err=document.getElementById('error'), res=document.getElementById('results'), empty=document.getElementById('empty'), meta=document.getElementById('meta'), pag=document.getElementById('pagination');
    loading.classList.remove('hidden'); err.classList.add('hidden'); res.innerHTML=''; empty.classList.add('hidden'); meta.classList.add('hidden'); pag.innerHTML='';
    var params=new URLSearchParams(); params.set('page',curPage); params.set('page_size','24'); if(activeTag) params.set('tag',activeTag);
    try{
      var r=await fetch('/api/v1/authors/'+slug+'?'+params.toString()); if(!r.ok) throw new Error(r.status);
      var d=await r.json(); var items=d.items||[]; var total=d.total||0;
      loading.classList.add('hidden');
      if(!items.length){ empty.classList.remove('hidden'); return }
      meta.textContent=(activeTag?'African works':'All works')+' by '+authorName+' · '+total+' book'+(total===1?'':'s'); meta.classList.remove('hidden');
      res.innerHTML=items.map(card).join('');
      var tp=Math.ceil(total/24);
      if(tp>1){ var h='';
        h+='<button onclick="load('+(curPage-1)+')" '+(curPage<=1?'disabled':'')+' class="px-4 py-2 rounded-full border bg-white text-sm '+(curPage<=1?'opacity-40':'')+'">Previous</button>';
        for(var i=Math.max(1,curPage-2);i<=Math.min(tp,curPage+2);i++) h+='<button onclick="load('+i+')" class="w-10 h-10 rounded-full text-sm '+(i===curPage?'bg-stone-900 text-white':'border bg-white')+'">'+i+'</button>';
        if(curPage+2<tp) h+='<span class="text-stone-400">…</span><button onclick="load('+tp+')" class="w-10 h-10 rounded-full border bg-white text-sm">'+tp+'</button>';
        h+='<button onclick="load('+(curPage+1)+')" '+(curPage>=tp?'disabled':'')+' class="px-4 py-2 rounded-full border bg-white text-sm '+(curPage>=tp?'opacity-40':'')+'">Next</button>';
        pag.innerHTML=h;
      }
    }catch(e){ loading.classList.add('hidden'); err.textContent='Could not load: '+e.message; err.classList.remove('hidden') }
  }
  function toggleAfrican(){
    activeTag = activeTag ? null : 'African Literature';
    document.getElementById('african-toggle').classList.toggle('active');
    curPage=1; load(1); scrollTo({top:0,behavior:'smooth'});
  }
  document.addEventListener('DOMContentLoaded',function(){ tagTotal(); load(1); });
</script>
</body>
</html>
