<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Book — Babe's Bookstore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
</head>
<body class="min-h-screen flex flex-col">
<nav class="sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center h-[68px]">
  <div class="flex items-center gap-8"><a href="/" class="font-serif text-[1.45rem] font-bold tracking-[-.02em]">Babe's<span class="font-normal text-stone-500"> —</span> Bookstore</a>
    <div class="hidden md:flex gap-7 text-sm font-medium"><a href="/bundles" class="text-stone-600 hover:text-stone-900">Bundles</a><a href="/search" class="text-stone-900">Library</a></div></div>
  <div class="flex items-center gap-3"><form action="/search" class="hidden sm:block"><input type="search" name="q" placeholder="Search…"></form><a href="/account" class="hidden sm:inline-flex px-4 py-2 rounded-full border bg-white text-sm font-medium">Account</a>
    <button class="md:hidden p-2 -mr-2" onclick="document.getElementById('m').classList.toggle('hidden')"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
</div></div><div id="m" class="hidden md:hidden border-t bg-white px-4 py-3 space-y-1"><a href="/bundles" class="block px-3 py-2.5 rounded-xl hover:bg-stone-50">Bundles</a><a href="/search" class="block px-3 py-2.5 rounded-xl bg-stone-100">Library</a></div></nav>

<main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 w-full">
  <a href="/search" class="inline-flex items-center gap-1.5 text-sm text-stone-500 hover:text-stone-900">← Back to library</a>
  <div id="loading" class="text-center py-20"><div class="inline-block w-8 h-8 border-4 border-stone-200 border-t-stone-800 rounded-full animate-spin"></div><p class="text-sm text-stone-500 mt-3">Loading…</p></div>
  <div id="err" class="hidden mt-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl">Book not found.</div>
  <div id="book" class="hidden mt-6">
    <div class="bg-white rounded-[22px] border overflow-hidden">
      <div class="md:flex">
        <div id="cover" class="md:w-[340px] shrink-0 bg-stone-50 border-b md:border-b-0 md:border-r min-h-[380px] flex"></div>
        <div class="flex-1 p-7 sm:p-8">
          <h1 id="title" class="font-serif text-3xl sm:text-4xl font-bold tracking-[-.02em] leading-tight"></h1>
          <p id="author" class="text-lg text-stone-600 mt-2"></p>
          <div id="meta" class="flex flex-wrap gap-2 mt-4"></div>
          <div id="desc" class="prose prose-stone max-w-none mt-6 text-stone-700 leading-7"></div>
          <div class="mt-8 bg-stone-50 rounded-2xl border p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">Find this book in a bundle</p>
            <p class="text-sm text-stone-600 mt-1">This title is part of our curated bundles — <a href="/bundles" class="underline">browse bundles</a> or <a href="/search" class="underline">search the library</a>.</p>
          </div>
          <div id="source" class="border-t mt-8 pt-6 text-sm text-stone-500"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"><div class="grid md:grid-cols-4 gap-8"><div><h3 class="font-serif text-xl font-bold mb-3">Babe's Bookstore</h3><p class="text-sm text-stone-400">An honest library.</p></div><div><h4 class="font-semibold text-white mb-3">Shop</h4><ul class="space-y-2 text-sm"><li><a href="/bundles">Bundles</a></li><li><a href="/search">Library</a></li></ul></div></div></div></footer>

<script src="/js/store.js"></script>
<script>
const grads=['from-amber-400 to-orange-500','from-rose-400 to-pink-500','from-emerald-400 to-teal-500','from-blue-400 to-indigo-500','from-violet-400 to-purple-500'];
function g(id){ return grads[Math.abs(id)%grads.length] }
function badge(t,c){ return `<span class="px-3 py-1 rounded-full text-xs font-medium border ${c}">${t}</span>` }
async function load(){
  const id=location.pathname.split('/').filter(Boolean).pop();
  const loading=document.getElementById('loading'), err=document.getElementById('err'), box=document.getElementById('book');
  try{
    const r=await fetch(`/api/v1/books/${encodeURIComponent(id)}`); if(!r.ok) throw new Error();
    const b=await r.json(); loading.classList.add('hidden'); box.classList.remove('hidden');
    document.title=b.title+" — Babe's Bookstore";
    const cover=document.getElementById('cover');
    if(b.cover_path && /^https?:\/\//.test(b.cover_path)) cover.innerHTML=`<img src="${b.cover_path}" alt="" class="w-full h-full object-cover">`;
    else cover.innerHTML=`<div class="w-full min-h-[380px] bg-gradient-to-br ${g(b.id)} flex items-center justify-center"><span class="text-white text-7xl font-serif font-bold opacity-80">${(b.title||'?').charAt(0)}</span></div>`;
    document.getElementById('title').textContent=b.title; document.getElementById('author').textContent=b.author?`by ${b.author}`:'';
    let m=""; if(b.license_type) m+=badge(b.license_type,'bg-emerald-50 text-emerald-800 border-emerald-200'); if(b.category) m+=badge(b.category,'bg-white text-stone-700 border-stone-200'); if(b.publication_year) m+=`<span class="text-sm text-stone-500">${b.publication_year}</span>`; if(b.language) m+=`<span class="text-sm text-stone-400">${b.language}</span>`;
    document.getElementById('meta').innerHTML=m;
    document.getElementById('desc').innerHTML=b.description?`<p class="whitespace-pre-wrap">${b.description}</p>`:'<p class="italic text-stone-400">No description.</p>';
    let s=""; if(b.source_url) s+=`<p>Sourced from <a href="${b.source_url}" target="_blank" rel="noopener" class="underline">${b.source_url}</a></p>`; if(b.source) s+=`<p class="text-stone-400 mt-1">${b.source}${b.source_id?' · #'+b.source_id:''}</p>`; document.getElementById('source').innerHTML=s||'<span class="italic">Source not listed.</span>';
  }catch(e){ loading.classList.add('hidden'); err.classList.remove('hidden') }
}
document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
