<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <title>Login — Babe's Bookstore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://babes-bookstore.fly.dev https://*.fly.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'self'">
  </head>
<body class="min-h-screen flex flex-col">
<nav class="sticky top-0 z-50"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"><div class="flex justify-between items-center h-[68px]">
  <div class="flex items-center gap-8"><a href="/" class="font-serif text-[1.45rem] font-bold tracking-[-.02em]">Babe's<span class="font-normal text-stone-500"> —</span> Bookstore</a>
    <div class="hidden md:flex gap-7 text-sm font-medium"><a href="/bundles" class="text-stone-600">Bundles</a><a href="/search" class="text-stone-600">Library</a></div></div>
  <div class="flex items-center gap-3"><a href="/register" class="hidden sm:inline-flex px-4 py-2 rounded-full border bg-white text-sm font-medium">Create account</a></div>
</div></div></nav>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-[440px]">
    <div class="text-center mb-8"><h1 class="font-serif text-3xl font-bold tracking-[-.02em]">Welcome back</h1><p class="text-stone-500 mt-2 text-sm">Sign in to your purchases and bundles</p></div>
    <div class="bg-white rounded-[22px] border p-7 sm:p-8 shadow-sm">
      <a href="/api/v1/auth/google/login" class="google-btn w-full flex items-center justify-center gap-3 px-4 py-3 rounded-full border bg-white text-sm font-medium hover:bg-stone-50"><svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Continue with Google</a>
      <p data-google-hint class="hidden text-center text-xs text-stone-400 mt-2">Google sign-in is not configured on this deployment — use email below.</p>
      <div class="relative my-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t"></div></div><div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-stone-400">or with email</span></div></div>
      <div id="err" class="hidden bg-red-50 border border-red-200 text-red-700 px-3 py-2.5 rounded-xl text-sm mb-4"></div>
      <form id="form" onsubmit="return false;" class="space-y-4">
        <div><label class="text-sm font-medium">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com" class="mt-1 w-full px-4 py-3 border rounded-xl"></div>
        <div><label class="text-sm font-medium">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="mt-1 w-full px-4 py-3 border rounded-xl"></div>
        <button onclick="login()" class="w-full py-3 rounded-full bg-stone-900 text-white font-semibold hover:bg-black">Sign in</button>
      </form>
      <p class="text-center text-sm text-stone-500 mt-6">No account? <a href="/register" class="font-medium text-stone-900 underline">Create one</a></p>
    </div>
  </div>
</main>

<footer><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 text-center text-sm text-stone-500">© <span data-copyright-year>2026</span> Babe's Bookstore</div></footer>

<script src="/js/store.js"></script>
<script>
async function login(){
  const err=document.getElementById('err'); err.classList.add('hidden');
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  if(!email||!password){ err.textContent='Enter email and password.'; err.classList.remove('hidden'); return }
  try{
    const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||'Login failed');
    localStorage.setItem('token', d.access_token||d.data?.access_token); localStorage.setItem('user', JSON.stringify(d.user));
    location.href=d.user?.is_admin?'/admin':'/account';
  }catch(e){ err.textContent=e.message; err.classList.remove('hidden') }
}
document.getElementById('form').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); login() } });
</script>
</body>
</html>
