<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Purchases - Babe's Bookstore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { amber: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' } },
                fontFamily: { serif: ['Playfair Display','serif'], sans: ['Inter','sans-serif'] }
            }}
        }
    </script>
    <link rel="stylesheet" href="/static/site.css">
    <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://babes-bookstore.fly.dev https://*.fly.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'self'">
  </head>
<body class="bg-stone-50 font-sans text-stone-800 min-h-screen flex flex-col">
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="font-serif text-2xl font-bold text-amber-700">Babe's Bookstore</a>
                    <div class="hidden md:flex ml-10 space-x-8">
                        <a href="/admin" class="text-stone-700 hover:text-amber-700 font-medium">Dashboard</a>
                        <a href="/admin/books" class="text-stone-700 hover:text-amber-700 font-medium">Books</a>
                        <a href="/admin/bundles" class="text-stone-700 hover:text-amber-700 font-medium">Bundles</a>
                        <a href="/admin/purchases" class="text-amber-700 font-medium">Purchases</a>
                    </div>
                </div>
                <a href="/account" class="text-sm text-stone-700 hover:text-amber-700">Account</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div id="access-denied" class="hidden text-center py-20">
            <h1 class="font-serif text-4xl font-bold text-red-600 mb-4">Access Denied</h1>
            <p class="text-stone-600 mb-6">You do not have permission to view this page.</p>
            <a href="/" class="inline-block bg-amber-700 text-white px-6 py-3 rounded-lg font-medium hover:bg-amber-800 transition">Go Home</a>
        </div>

        <div id="admin-content" class="hidden">
            <h1 class="font-serif text-3xl font-bold text-stone-900 mb-6">Purchases</h1>

            <div class="flex flex-wrap gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">Status</label>
                    <select id="status-filter" onchange="loadPurchases(1)" class="border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="">All</option>
                        <option value="completed">Completed</option>
                        <option value="paid">Paid</option>
                        <option value="pending">Pending</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-stone-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-stone-50 border-b border-stone-200">
                            <tr>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">ID</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Bundle</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Customer</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Amount</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Status</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Provider</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Downloads</th>
                                <th class="text-left px-4 py-3 font-medium text-stone-600">Created</th>
                            </tr>
                        </thead>
                        <tbody id="purchases-tbody" class="divide-y divide-stone-100"></tbody>
                    </table>
                </div>
                <div id="purchases-loading" class="py-10 text-center text-stone-500">Loading...</div>
            </div>

            <div id="pagination" class="flex justify-center items-center gap-2 mt-6"></div>
        </div>
    </main>

    <footer class="bg-stone-900 text-stone-300 mt-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="border-t border-stone-800 mt-8 pt-8 text-sm text-center">
                <p>&copy; 2026 Babe's Bookstore.</p>
            </div>
        </div>
    </footer>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        let currentPage = 1;
        let totalPages = 1;

        if (!token || !user.is_admin) {
            document.getElementById('access-denied').classList.remove('hidden');
        } else {
            document.getElementById('admin-content').classList.remove('hidden');
            loadPurchases(1);
        }

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }

        async function loadPurchases(page) {
            currentPage = page;
            const tbody = document.getElementById('purchases-tbody');
            const loading = document.getElementById('purchases-loading');
            tbody.innerHTML = '';
            loading.classList.remove('hidden');

            const status = document.getElementById('status-filter').value;
            let url = `/api/v1/admin/purchases?page=${page}&page_size=50`;
            if (status) url += `&status=${status}`;

            try {
                const res = await fetch(url, { headers: authHeaders() });
                if (res.status === 403) {
                    loading.textContent = 'Your session expired. Please log in again.';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load purchases');
                const data = await res.json();
                const purchases = data.items || [];
                totalPages = Math.ceil((data.total || 0) / 50) || 1;
                loading.classList.add('hidden');

                if (purchases.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-10 text-center text-stone-500">No purchases found.</td></tr>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                tbody.innerHTML = purchases.map(p => `
                    <tr class="hover:bg-stone-50">
                        <td class="px-4 py-3 text-stone-600">${p.id}</td>
                        <td class="px-4 py-3 font-medium text-stone-900">${escapeHtml(p.bundle_name || 'Bundle #' + p.bundle_id)}</td>
                        <td class="px-4 py-3 text-stone-600">${escapeHtml(p.customer_email || '')}</td>
                        <td class="px-4 py-3 text-stone-600">£${(p.amount_cents / 100).toFixed(2)}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${statusBadge(p.status)}">${escapeHtml(p.status)}</span></td>
                        <td class="px-4 py-3 text-stone-600">${escapeHtml(p.payment_provider || '')}</td>
                        <td class="px-4 py-3 text-stone-600">${p.download_count}/${p.max_downloads}</td>
                        <td class="px-4 py-3 text-stone-600">${new Date(p.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');
                renderPagination();
            } catch (e) {
                loading.textContent = 'Error loading purchases.';
            }
        }

        function statusBadge(status) {
            const colors = {
                completed: 'bg-green-100 text-green-800',
                paid: 'bg-blue-100 text-blue-800',
                pending: 'bg-amber-100 text-amber-800',
                failed: 'bg-red-100 text-red-800',
            };
            return colors[status] || 'bg-stone-100 text-stone-800';
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            if (totalPages <= 1) return;
            if (currentPage > 1) {
                const prev = document.createElement('button');
                prev.textContent = '← Prev';
                prev.className = 'px-3 py-1.5 text-sm border border-stone-300 rounded-lg hover:bg-stone-100 transition';
                prev.onclick = () => loadPurchases(currentPage - 1);
                container.appendChild(prev);
            }
            const info = document.createElement('span');
            info.textContent = `Page ${currentPage} of ${totalPages}`;
            info.className = 'px-3 py-1.5 text-sm text-stone-600';
            container.appendChild(info);
            if (currentPage < totalPages) {
                const next = document.createElement('button');
                next.textContent = 'Next →';
                next.className = 'px-3 py-1.5 text-sm border border-stone-300 rounded-lg hover:bg-stone-100 transition';
                next.onclick = () => loadPurchases(currentPage + 1);
                container.appendChild(next);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>
</html>
