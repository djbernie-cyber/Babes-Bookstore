<div class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow">
    {% if book.cover_path %}
    <img src="{{ book.cover_path }}" alt="{{ book.title }}" class="w-full h-56 object-cover">
    {% else %}
    <div class="w-full h-56 bg-gradient-to-br from-stone-100 to-stone-200 flex items-center justify-center p-4">
        <span class="font-serif text-center text-stone-700">{{ book.title[:60] }}</span>
    </div>
    {% endif %}
    <div class="p-4">
        <h3 class="font-serif text-lg font-bold text-stone-900 line-clamp-2">{{ book.title }}</h3>
        {% if book.author %}
        <p class="text-sm text-stone-600 mt-1">{{ book.author }}</p>
        {% endif %}
        {% if book.publication_year %}
        <p class="text-xs text-stone-500 mt-1">{{ book.publication_year }}</p>
        {% endif %}
    </div>
</div>
