<div class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-lg transition-shadow">
    {% if bundle.cover_image_path %}
    <img src="{{ bundle.cover_image_path }}" alt="{{ bundle.name }}" class="w-full h-48 object-cover">
    {% else %}
    <div class="w-full h-48 bg-gradient-to-br from-amber-100 to-amber-200 flex items-center justify-center">
        <span class="font-serif text-3xl text-amber-700">{{ bundle.name[0] }}</span>
    </div>
    {% endif %}
    <div class="p-4">
        <h3 class="font-serif text-xl font-bold text-stone-900">{{ bundle.name }}</h3>
        <p class="text-sm text-stone-600 mt-1">{{ bundle.books | length }} books</p>
        {% if bundle.description %}
        <p class="text-sm text-stone-700 mt-2 line-clamp-2">{{ bundle.description }}</p>
        {% endif %}
        <div class="flex items-center justify-between mt-4">
            <span class="text-2xl font-bold text-amber-700">${{ "%.2f" | format(bundle.price_cents / 100) }}</span>
            <a href="/bundles/{{ bundle.slug }}"
               class="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 text-sm font-medium">
                View Bundle
            </a>
        </div>
    </div>
</div>
