{% extends "base.html" %}
{% block title %}Book — Babe's Bookstore{% endblock %}

{% block content %}
<div id="book-content" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <p class="text-stone-500">Loading book...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/v1/books/{{ book_id }}');
            if (!res.ok) throw new Error('Not found');
            const b = await res.json();
            document.title = `${b.title} — Babe's Bookstore`;

            document.getElementById('book-content').innerHTML = `
                <a href="/search" class="text-amber-700 hover:text-amber-800 font-medium mb-6 inline-block">&larr; Search</a>
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="md:w-1/3">
                        ${b.cover_path
                            ? `<img src="${b.cover_path}" alt="${b.title}" class="w-full rounded-lg shadow-md">`
                            : `<div class="w-full h-64 bg-gradient-to-br from-stone-100 to-stone-200 rounded-lg flex items-center justify-center p-6">
                                <span class="font-serif text-center text-stone-700 text-xl">${b.title}</span>
                               </div>`
                        }
                    </div>
                    <div class="md:w-2/3">
                        <h1 class="font-serif text-3xl font-bold mb-2">${b.title}</h1>
                        <p class="text-lg text-stone-600 mb-4">${b.author || 'Unknown Author'}</p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-3 py-1 bg-amber-100 text-amber-800 text-sm rounded-full">${b.license_type}</span>
                            ${b.category ? `<span class="px-3 py-1 bg-stone-100 text-stone-700 text-sm rounded-full">${b.category}</span>` : ''}
                            ${b.publication_year ? `<span class="px-3 py-1 bg-stone-100 text-stone-700 text-sm rounded-full">${b.publication_year}</span>` : ''}
                        </div>
                        ${b.description ? `<p class="text-stone-700 leading-relaxed">${b.description}</p>` : ''}
                        <div class="mt-6 p-4 bg-stone-50 rounded-lg text-sm text-stone-600">
                            <p><strong>Source:</strong> ${b.source}</p>
                            ${b.source_url ? `<p><a href="${b.source_url}" target="_blank" class="text-amber-700 hover:underline">View original at source &rarr;</a></p>` : ''}
                        </div>
                    </div>
                </div>
            `;
        } catch(e) {
            document.getElementById('book-content').innerHTML = '<p class="text-center text-stone-500 py-12">Book not found.</p>';
        }
    });
</script>
{% endblock %}
