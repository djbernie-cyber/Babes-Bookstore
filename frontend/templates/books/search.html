{% extends "base.html" %}
{% block title %}Search — Babe's Bookstore{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-4xl font-bold mb-8">Search Books</h1>

    <div class="max-w-2xl mb-8">
        <form action="/search" method="get" class="flex gap-2">
            <input type="search" name="q" value="{{ query }}" placeholder="Search by title, author, or topic..."
                   class="flex-1 px-4 py-3 border border-stone-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            <button type="submit" class="px-8 py-3 bg-amber-700 text-white rounded-lg hover:bg-amber-800 font-semibold">Search</button>
        </form>
    </div>

    <div id="search-results">
        {% if query %}
        <p class="text-stone-500">Loading results for "{{ query }}"...</p>
        {% else %}
        <div class="text-center py-12 text-stone-500">
            <p class="text-lg">Enter a search term to find books.</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const query = "{{ query }}";
    if (query) {
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`/api/v1/search?q=${encodeURIComponent(query)}&page_size=40`);
                const data = await res.json();
                const container = document.getElementById('search-results');
                if (data.items && data.items.length > 0) {
                    container.innerHTML = `
                        <p class="text-stone-600 mb-6">${data.total} result${data.total !== 1 ? 's' : ''}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${data.items.map(b => `
                                <a href="/books/${b.id}" class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow block">
                                    ${b.cover_path
                                        ? `<img src="${b.cover_path}" alt="${b.title}" class="w-full h-48 object-cover">`
                                        : `<div class="w-full h-48 bg-gradient-to-br from-stone-100 to-stone-200 flex items-center justify-center p-4">
                                            <span class="font-serif text-center text-stone-700">${b.title.substring(0, 60)}</span>
                                           </div>`
                                    }
                                    <div class="p-4">
                                        <h3 class="font-serif text-lg font-bold text-stone-900 line-clamp-2">${b.title}</h3>
                                        <p class="text-sm text-stone-600 mt-1">${b.author || 'Unknown'}</p>
                                        ${b.publication_year ? `<p class="text-xs text-stone-500 mt-1">${b.publication_year}</p>` : ''}
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div class="text-center py-12 text-stone-500"><p>No books found. Try a different search.</p></div>';
                }
            } catch(e) {
                document.getElementById('search-results').innerHTML = '<p class="text-center text-red-600">Search failed. Please try again.</p>';
            }
        });
    }
</script>
{% endblock %}
