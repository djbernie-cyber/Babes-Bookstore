{% extends "base.html" %}
{% block title %}Admin Books — Babe's Bookstore{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-4xl font-bold mb-8">Manage Books</h1>

    <div class="flex gap-4 mb-6">
        <select id="status-filter" onchange="loadBooks()" class="px-4 py-2 border border-stone-300 rounded-lg">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
        </select>
        <select id="source-filter" onchange="loadBooks()" class="px-4 py-2 border border-stone-300 rounded-lg">
            <option value="">All Sources</option>
            <option value="gutenberg">Project Gutenberg</option>
            <option value="standard_ebooks">Standard Ebooks</option>
            <option value="doab">DOAB</option>
            <option value="oapen">OAPEN</option>
            <option value="open_library">Open Library</option>
            <option value="internet_archive">Internet Archive</option>
        </select>
    </div>

    <div id="books-table" class="bg-white rounded-lg shadow-md overflow-hidden">
        <p class="text-stone-500 text-center py-8">Loading books...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const headers = {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'};

    if (!token || !user || !user.is_admin) {
        document.body.innerHTML = '<div class="text-center py-20"><h1 class="text-2xl font-bold">Access Denied</h1></div>';
    }

    async function loadBooks(page = 1) {
        const status = document.getElementById('status-filter').value;
        const source = document.getElementById('source-filter').value;
        let url = `/api/v1/books?page=${page}&page_size=20&approved_only=false`;
        if (status) url += `&status=${status}`;
        if (source) url += `&source=${source}`;

        try {
            const res = await fetch(url, { headers });
            const data = await res.json();
            const container = document.getElementById('books-table');

            if (!data.items || data.items.length === 0) {
                container.innerHTML = '<p class="text-center text-stone-500 py-8">No books found.</p>';
                return;
            }

            container.innerHTML = `
                <table class="w-full">
                    <thead class="bg-stone-100">
                        <tr>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Title</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Author</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Source</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">License</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Status</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-stone-200">
                        ${data.items.map(b => `
                            <tr class="hover:bg-stone-50">
                                <td class="px-4 py-3 text-sm font-medium text-stone-900 max-w-[200px] truncate">${b.title}</td>
                                <td class="px-4 py-3 text-sm text-stone-600 max-w-[150px] truncate">${b.author || '-'}</td>
                                <td class="px-4 py-3 text-sm text-stone-600">${b.source}</td>
                                <td class="px-4 py-3 text-sm"><span class="px-2 py-1 rounded-full text-xs ${b.license_verified ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${b.license_type}</span></td>
                                <td class="px-4 py-3 text-sm"><span class="px-2 py-1 rounded-full text-xs ${b.status === 'approved' ? 'bg-green-100 text-green-800' : b.status === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}">${b.status}</span></td>
                                <td class="px-4 py-3 text-sm space-x-2">
                                    ${b.status !== 'approved' ? `<button onclick="updateBook(${b.id}, 'approve')" class="px-2 py-1 bg-green-600 text-white rounded text-xs hover:bg-green-700">Approve</button>` : ''}
                                    ${b.status !== 'rejected' ? `<button onclick="updateBook(${b.id}, 'reject')" class="px-2 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">Reject</button>` : ''}
                                    <a href="/books/${b.id}" class="px-2 py-1 bg-stone-200 text-stone-700 rounded text-xs hover:bg-stone-300">View</a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="flex justify-between items-center px-4 py-3 border-t border-stone-200">
                    <span class="text-sm text-stone-600">${data.total} total books</span>
                    <div class="flex gap-2">
                        ${page > 1 ? `<button onclick="loadBooks(${page-1})" class="px-3 py-1 bg-stone-200 rounded text-sm">Previous</button>` : ''}
                        <span class="px-3 py-1 text-sm text-stone-600">Page ${data.page}</span>
                        ${data.items.length === 20 ? `<button onclick="loadBooks(${page+1})" class="px-3 py-1 bg-stone-200 rounded text-sm">Next</button>` : ''}
                    </div>
                </div>
            `;
        } catch(e) {
            document.getElementById('books-table').innerHTML = '<p class="text-center text-red-600 py-8">Failed to load books.</p>';
        }
    }

    async function updateBook(id, action) {
        try {
            await fetch(`/api/v1/books/${id}/${action}`, { method: 'POST', headers });
            loadBooks();
        } catch(e) { alert('Failed'); }
    }

    loadBooks();
</script>
{% endblock %}
