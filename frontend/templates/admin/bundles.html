{% extends "base.html" %}
{% block title %}Admin Bundles — Babe's Bookstore{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex justify-between items-center mb-8">
        <h1 class="font-serif text-4xl font-bold">Manage Bundles</h1>
        <button onclick="showCreateForm()" class="px-4 py-2 bg-amber-700 text-white rounded-lg hover:bg-amber-800">+ New Bundle</button>
    </div>

    <div id="create-form" class="hidden bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="font-serif text-2xl font-bold mb-4">Create Bundle</h2>
        <form onsubmit="createBundle(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Name</label>
                    <input type="text" id="bundle-name" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Slug</label>
                    <input type="text" id="bundle-slug" required class="w-full px-3 py-2 border rounded-lg" placeholder="my-bundle">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea id="bundle-desc" rows="3" class="w-full px-3 py-2 border rounded-lg"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Price (cents)</label>
                    <input type="number" id="bundle-price" required min="0" class="w-full px-3 py-2 border rounded-lg" value="999">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Category</label>
                    <input type="text" id="bundle-category" class="w-full px-3 py-2 border rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Book IDs (comma-separated)</label>
                <input type="text" id="bundle-books" class="w-full px-3 py-2 border rounded-lg" placeholder="1,2,3,4,5">
            </div>
            <div class="flex gap-3">
                <button type="submit" class="px-4 py-2 bg-amber-700 text-white rounded-lg hover:bg-amber-800">Create</button>
                <button type="button" onclick="hideCreateForm()" class="px-4 py-2 bg-stone-200 text-stone-700 rounded-lg">Cancel</button>
            </div>
            <div id="create-status" class="text-sm"></div>
        </form>
    </div>

    <div id="bundles-table" class="bg-white rounded-lg shadow-md overflow-hidden">
        <p class="text-stone-500 text-center py-8">Loading bundles...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const headers = {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'};

    if (!token || !user || !user.is_admin) {
        document.body.innerHTML = '<div class="text-center py-20"><h1 class="text-2xl font-bold">Access Denied</h1></div>';
    }

    function showCreateForm() { document.getElementById('create-form').classList.remove('hidden'); }
    function hideCreateForm() { document.getElementById('create-form').classList.add('hidden'); }

    async function loadBundles() {
        try {
            const res = await fetch('/api/v1/bundles?active_only=false', { headers });
            const data = await res.json();
            const container = document.getElementById('bundles-table');
            if (!data.items || data.items.length === 0) {
                container.innerHTML = '<p class="text-center text-stone-500 py-8">No bundles.</p>';
                return;
            }
            container.innerHTML = `
                <table class="w-full">
                    <thead class="bg-stone-100">
                        <tr>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Name</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Books</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Price</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Active</th>
                            <th class="text-left px-4 py-3 text-sm font-medium text-stone-700">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-stone-200">
                        ${data.items.map(b => `
                            <tr class="hover:bg-stone-50">
                                <td class="px-4 py-3 text-sm font-medium text-stone-900">${b.name}</td>
                                <td class="px-4 py-3 text-sm text-stone-600">${b.books ? b.books.length : 0}</td>
                                <td class="px-4 py-3 text-sm text-stone-600">$${(b.price_cents / 100).toFixed(2)}</td>
                                <td class="px-4 py-3 text-sm">${b.active ? '<span class="text-green-700">Yes</span>' : '<span class="text-red-700">No</span>'}</td>
                                <td class="px-4 py-3 text-sm space-x-2">
                                    <a href="/bundles/${b.slug}" class="px-2 py-1 bg-stone-200 text-stone-700 rounded text-xs">View</a>
                                    <button onclick="toggleBundle(${b.id}, ${!b.active})" class="px-2 py-1 bg-yellow-200 text-yellow-800 rounded text-xs">${b.active ? 'Deactivate' : 'Activate'}</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch(e) {
            document.getElementById('bundles-table').innerHTML = '<p class="text-center text-red-600 py-8">Failed to load.</p>';
        }
    }

    async function createBundle(e) {
        e.preventDefault();
        const status = document.getElementById('create-status');
        const bookIds = document.getElementById('bundle-books').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        try {
            const res = await fetch('/api/v1/bundles', {
                method: 'POST',
                headers,
                body: JSON.stringify({
                    name: document.getElementById('bundle-name').value,
                    slug: document.getElementById('bundle-slug').value,
                    description: document.getElementById('bundle-desc').value || null,
                    price_cents: parseInt(document.getElementById('bundle-price').value),
                    category: document.getElementById('bundle-category').value || null,
                    book_ids: bookIds,
                })
            });
            const data = await res.json();
            if (res.ok) {
                status.textContent = 'Bundle created!';
                hideCreateForm();
                loadBundles();
            } else {
                status.textContent = data.detail || 'Failed';
            }
        } catch(e) { status.textContent = 'Network error'; }
    }

    async function toggleBundle(id, active) {
        await fetch(`/api/v1/bundles/${id}`, {
            method: 'PATCH', headers,
            body: JSON.stringify({ active })
        });
        loadBundles();
    }

    loadBundles();
</script>
{% endblock %}
