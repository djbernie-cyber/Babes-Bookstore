{% extends "base.html" %}
{% block title %}Bundles — Babe's Bookstore{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-4xl font-bold mb-8">Book Bundles</h1>

    <div class="flex flex-wrap gap-4 mb-8">
        <button onclick="filterCategory('')" class="px-4 py-2 rounded-lg bg-amber-600 text-white font-medium category-btn active">All</button>
        <button onclick="filterCategory('fiction')" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 font-medium category-btn">Fiction</button>
        <button onclick="filterCategory('nonfiction')" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 font-medium category-btn">Non-Fiction</button>
        <button onclick="filterCategory('science')" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 font-medium category-btn">Science</button>
        <button onclick="filterCategory('philosophy')" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 font-medium category-btn">Philosophy</button>
        <button onclick="filterCategory('history')" class="px-4 py-2 rounded-lg bg-stone-200 text-stone-700 font-medium category-btn">History</button>
    </div>

    <div id="bundles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="text-center text-stone-500 col-span-3 py-12">Loading bundles...</div>
    </div>

    <div id="pagination" class="flex justify-center gap-4 mt-8"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let currentCategory = '';

    async function loadBundles(page = 1) {
        currentPage = page;
        let url = `/api/v1/bundles?page=${page}&page_size=12`;
        if (currentCategory) url += `&category=${currentCategory}`;
        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('bundles-grid');
        if (data.items && data.items.length > 0) {
            grid.innerHTML = data.items.map(b => `
                <div class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-lg transition-shadow">
                    <div class="w-full h-48 bg-gradient-to-br from-amber-100 to-amber-200 flex items-center justify-center">
                        <span class="font-serif text-3xl text-amber-700">${b.name.charAt(0)}</span>
                    </div>
                    <div class="p-4">
                        <h3 class="font-serif text-xl font-bold text-stone-900">${b.name}</h3>
                        <p class="text-sm text-stone-600 mt-1">${b.books ? b.books.length : 0} books</p>
                        <p class="text-sm text-stone-700 mt-2 line-clamp-2">${b.description || ''}</p>
                        <div class="flex items-center justify-between mt-4">
                                <span class="text-2xl font-bold text-amber-700">£10.00</span>
                                <a href="/bundles/${b.slug}" class="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 text-sm font-medium">View Bundle</a>
                        </div>
                    </div>
                </div>
            `).join('');
            const totalPages = Math.ceil(data.total / 12);
            const pag = document.getElementById('pagination');
            pag.innerHTML = '';
            if (totalPages > 1) {
                if (page > 1) pag.innerHTML += `<button onclick="loadBundles(${page-1})" class="px-4 py-2 bg-stone-200 rounded-lg">Previous</button>`;
                pag.innerHTML += `<span class="px-4 py-2">Page ${page} of ${totalPages}</span>`;
                if (page < totalPages) pag.innerHTML += `<button onclick="loadBundles(${page+1})" class="px-4 py-2 bg-stone-200 rounded-lg">Next</button>`;
            }
        } else {
            grid.innerHTML = '<p class="text-center text-stone-500 col-span-3">No bundles found.</p>';
        }
    }

    function filterCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.category-btn').forEach(b => {
            b.classList.remove('bg-amber-600', 'text-white', 'active');
            b.classList.add('bg-stone-200', 'text-stone-700');
        });
        event.target.classList.remove('bg-stone-200', 'text-stone-700');
        event.target.classList.add('bg-amber-600', 'text-white', 'active');
        loadBundles(1);
    }

    loadBundles(1);
</script>
{% endblock %}
