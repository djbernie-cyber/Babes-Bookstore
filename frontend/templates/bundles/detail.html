{% extends "base.html" %}
{% block title %}Bundle — Babe's Bookstore{% endblock %}

{% block content %}
<div id="bundle-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <p class="text-stone-500">Loading bundle...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    const PRICE = "10.00";
    const CURRENCY = "£";

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch(`/api/v1/bundles/{{ slug }}`);
            if (!res.ok) throw new Error('Not found');
            const b = await res.json();
            document.title = `${b.name} — Babe's Bookstore`;

            let booksHtml = '';
            if (b.books && b.books.length > 0) {
                booksHtml = b.books.map((book, i) => `
                    <div class="flex items-start gap-4 p-4 bg-stone-50 rounded-lg">
                        <span class="text-stone-400 font-mono text-sm mt-1">${i + 1}</span>
                        <div class="flex-1">
                            <a href="/books/${book.id}" class="font-serif text-lg font-bold text-stone-900 hover:text-amber-700">${book.title}</a>
                            <p class="text-sm text-stone-600">${book.author || 'Unknown Author'}</p>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('bundle-content').innerHTML = `
                <a href="/bundles" class="text-amber-700 hover:text-amber-800 font-medium mb-6 inline-block">&larr; All Bundles</a>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                    <div class="lg:col-span-2">
                        <h1 class="font-serif text-4xl font-bold mb-4">${b.name}</h1>
                        <p class="text-lg text-stone-700 mb-6">${b.description || ''}</p>
                        ${b.long_description ? `<div class="prose prose-stone max-w-none mb-6">${b.long_description}</div>` : ''}
                        <h2 class="font-serif text-2xl font-bold mb-4">Books in this Bundle (${b.books ? b.books.length : 0})</h2>
                        <div class="space-y-3">${booksHtml || '<p class="text-stone-500">No books in this bundle yet.</p>'}</div>
                    </div>
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-lg shadow-md p-6 sticky top-24">
                            <div class="text-center mb-6">
                                <div class="text-4xl font-bold text-amber-700 mb-2">${CURRENCY}${PRICE}</div>
                                <p class="text-stone-600">${b.books ? b.books.length : 0} books included</p>
                                <p class="text-xs text-stone-400 mt-1">Standard price — all bundles</p>
                            </div>

                            <div id="payment-buttons" class="space-y-3">
                                <button onclick="payWith('stripe')" class="w-full py-3 bg-amber-700 text-white rounded-lg hover:bg-amber-800 font-semibold text-lg">
                                    Pay with Card
                                </button>
                                <button onclick="payWith('paypal')" class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold text-lg flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.01 1.15 1.304 2.42 1.012 4.287-.023.143-.047.288-.077.437-.983 5.05-4.349 6.797-8.647 6.797h-2.19c-.524 0-.968.382-1.05.9l-1.12 7.106z"/></svg>
                                    Pay with PayPal
                                </button>
                                <button onclick="payWith('square')" class="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-lg flex items-center justify-center gap-2">
                                    Pay with Square
                                </button>
                                <button onclick="payWith('apple')" class="w-full py-3 bg-black text-white rounded-lg hover:bg-gray-800 font-semibold text-lg flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                                    Pay with Apple Pay
                                </button>
                                <button onclick="payWith('google')" class="w-full py-3 bg-white border-2 border-stone-300 text-stone-700 rounded-lg hover:bg-stone-50 font-semibold text-lg flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                    Pay with Google Pay
                                </button>
                            </div>

                            <p class="text-xs text-stone-500 mt-4 text-center">Instant download after purchase</p>
                        </div>
                    </div>
                </div>
            `;
        } catch(e) {
            document.getElementById('bundle-content').innerHTML = '<p class="text-center text-stone-500 py-12">Bundle not found.</p>';
        }
    });

    async function payWith(provider) {
        const email = prompt('Enter your email to receive the download link:');
        if (!email) return;

        const bundleId = parseInt(window.location.pathname.split('/').pop());

        if (provider === 'apple' || provider === 'google') {
            const res = await fetch(`/api/v1/checkout/${provider}-pay`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    bundle_id: bundleId,
                    email: email,
                    success_url: window.location.origin + '/account',
                    cancel_url: window.location.href,
                })
            });
            const data = await res.json();
            if (data.client_secret) {
                // Client-side payment element would be rendered here
                alert('Payment element ready. Integrate Stripe.js on the frontend to complete.');
            }
            return;
        }

        let endpoint = '/api/v1/checkout/stripe';
        if (provider === 'paypal') endpoint = '/api/v1/checkout/paypal';
        if (provider === 'square') endpoint = '/api/v1/checkout/square';

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    bundle_id: bundleId,
                    email: email,
                    success_url: window.location.origin + '/account',
                    cancel_url: window.location.href,
                })
            });
            const data = await res.json();
            if (data.checkout_url) {
                window.location.href = data.checkout_url;
            } else {
                alert('Payment setup failed. Please try again.');
            }
        } catch(e) {
            alert('Error: ' + e.message);
        }
    }
</script>
{% endblock %}
