{% extends "base.html" %}
{% block title %}My Purchases — Babe's Bookstore{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="font-serif text-4xl font-bold mb-8">My Purchases</h1>

    <div id="user-info" class="bg-white rounded-lg shadow-md p-6 mb-8 hidden">
        <p class="text-stone-700">Welcome back, <strong id="user-name"></strong> (<span id="user-email"></span>)</p>
    </div>

    <div id="purchases-content">
        <p class="text-stone-500 text-center py-12">Loading purchases...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (!token || !user) {
            document.getElementById('purchases-content').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-stone-600 mb-4">Please login to view your purchases.</p>
                    <a href="/login" class="px-6 py-3 bg-amber-700 text-white rounded-lg hover:bg-amber-800 font-semibold">Login</a>
                </div>
            `;
            return;
        }

        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-name').textContent = user.name || user.email;
        document.getElementById('user-email').textContent = user.email;

        try {
            const res = await fetch('/api/v1/auth/me', {
                headers: {'Authorization': `Bearer ${token}`}
            });
            if (!res.ok) throw new Error('Not authenticated');
            const data = await res.json();

            document.getElementById('purchases-content').innerHTML = `
                <div class="bg-white rounded-lg shadow-md p-6">
                    <p class="text-stone-700 mb-4">Purchases will appear here after you buy a bundle.</p>
                    <a href="/bundles" class="text-amber-700 hover:underline font-medium">Browse bundles &rarr;</a>
                </div>
            `;
        } catch(e) {
            document.getElementById('purchases-content').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-stone-600 mb-4">Session expired. Please login again.</p>
                    <a href="/login" class="px-6 py-3 bg-amber-700 text-white rounded-lg hover:bg-amber-800 font-semibold">Login</a>
                </div>
            `;
        }
    });
</script>
{% endblock %}
