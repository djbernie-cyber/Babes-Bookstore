# fly.toml app configuration file generated for babes-bookstore on 2026-08-23T15:01:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'babes-bookstore'
primary_region = 'lhr'

[build]
  dockerfile = 'backend/Dockerfile'

# Process groups are declared explicitly rather than left to the Dockerfile's
# FLY_PROCESS_GROUP branch. Without this, Fly has no managed `worker` group:
# the [[vm]] block below is only a config template, applied when a machine is
# asked for, so `fly deploy` never created or updated one. That is how
# `babes-worker` ended up as an unmanaged machine running an old
# `babes-bookstore:carousel` image with an empty process group -- invisible to
# every subsequent deploy, and months behind the schema it was working
# against. Declaring the groups here means the worker is managed, and gets
# updated with the app from now on.
[processes]
  app = "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips='*'"
  worker = "exec celery -A app.celery_app:celery_app worker --beat --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} --prefetch-multiplier=1"

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'
  DEBUG = 'false'
  APP_NAME = 'Babe\u0027s Bookstore'
  FRONTEND_URL = 'https://babesbooks.store'
  CELERY_CONCURRENCY = '4'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep machines warm: an 'off' (always-on) policy avoids cold starts that
  # otherwise make the storefront look broken through the Netlify /api proxy.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # The app group boots `alembic upgrade head && exec uvicorn`, so nothing
    # is listening while migrations run. Measured on the live table: the
    # search_text backfill alone is ~26s for 84,605 rows, which is why the
    # old 20s grace period was shorter than the startup it was guarding --
    # the check would fail against a process that was still migrating, and
    # Fly would restart a machine that was doing exactly what it was asked.
    # Sized for the slowest migration in the chain, not the common case.
    grace_period = '180s'
    method = 'GET'
    path = '/health'

[[vm]]
  # App process: serving the API + storefront.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['app']

[[vm]]
  # Worker process: Celery (scrapes, licence verification, periodic cleanup).
  # Scaled up to comfortably run the ~74k-book Gutenberg full-catalogue harvest.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['worker']