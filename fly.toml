app = 'babes-bookstore'
primary_region = 'lhr'

[processes]
  app = ''
  worker = ''

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'
  DEBUG = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  # App process: serving the API + storefront.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['app']

[[vm]]
  # Worker process: Celery (scrapes, licence verification, periodic cleanup).
  # Scaled up to comfortably run the ~74k-book Gutenberg full-catalogue harvest.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['worker']
