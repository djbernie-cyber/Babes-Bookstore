# fly.toml app configuration file generated for babes-bookstore on 2026-08-23T15:01:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'babes-bookstore'
primary_region = 'lhr'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  DEBUG = 'false'
  PORT = '8000'
  WEB_CONCURRENCY = '2'

[processes]
  app = ''
  worker = ''

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
