# fly.toml app configuration file generated for babes-bookstore on 2026-08-23T15:01:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'babes-bookstore'
primary_region = 'lhr'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'
  DEBUG = 'false'
  APP_NAME = 'Babe\u0027s Bookstore'
  FRONTEND_URL = 'https://babesbooks.store'
  CELERY_CONCURRENCY = '4'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep machines warm: an 'off' (always-on) policy avoids cold starts that
  # otherwise make the storefront look broken through the Netlify /api proxy.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  # App process: serving the API + storefront.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['app']

[[vm]]
  # Worker process: Celery (scrapes, licence verification, periodic cleanup).
  # Scaled up to comfortably run the ~74k-book Gutenberg full-catalogue harvest.
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['worker']