app = 'babes-bookstore-api'
primary_region = 'lhr'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'
  DEBUG = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  cpu_kind = 'shared'
