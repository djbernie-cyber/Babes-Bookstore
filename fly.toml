app = 'babes-bookstore-api'
primary_region = 'lhr'

[build]

[env]
  PORT = '8000'
  PYTHON_VERSION = '3.12'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  internal_port = 8000
  protocol = 'tcp'
  processes = ['app']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
