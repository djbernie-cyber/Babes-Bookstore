# fly.toml app configuration file generated for babes-bookstore on 2026-09-28T13:54:27Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'babes-bookstore'
primary_region = 'lhr'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  WEB_CONCURRENCY = '2'
  DEBUG = 'false'
  APP_NAME = 'Babe\u0027s Bookstore'
  FRONTEND_URL = 'https://babesbooks.store'
  CELERY_CONCURRENCY = '4'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep machines warm: an 'off' (always-on) policy avoids cold starts that
  # otherwise make the storefront look broken through the Netlify /api proxy.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '3m0s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]
  concurrency = { hard_limit = 250, soft_limit = 200, type = 'requests' }

[[vm]]
  size = 'shared-cpu-8x'
  memory = '16gb'
  cpus = 8
  cpu_kind = 'shared'
  processes = ['app']
  memory_mb = 16384

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  cpu_kind = 'shared'
  processes = ['worker']
