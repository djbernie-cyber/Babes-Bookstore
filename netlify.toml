# Netlify serves the static storefront; /api/* is proxied to Fly.io via
# frontend/_redirects so browsers only ever talk to one origin (babesbooks.store).
# There is no JS build step: files ship exactly as committed (skip_processing
# disables Netlify's HTML/asset rewriting which previously caused stale,
# unexpected build output).
[build]
  base = "."
  publish = "frontend"
  command = "echo 'Static site - no build needed'"

[build.environment]
  NODE_VERSION = "18"

[build.processing]
  skip_processing = true

# Netlify was serving /static/site.css as `immutable, max-age=31536000` under
# an unhashed filename. Any browser that had loaded the storefront once kept
# that stylesheet for a year, so CSS fixes deployed successfully and never
# arrived -- the home carousel's card sizing was fixed in a stylesheet no
# returning visitor ever re-fetched. There is no build step here to fingerprint
# these names, so they must revalidate. If a real bundler is added later,
# fingerprinted assets can go back to immutable.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
