# Netlify-only deployment: static frontend + Netlify Functions API + Netlify Blobs (NoSQL).
# No external backend, no Fly, no third-party SaaS dependencies required for core operation.
[build]
  base = "."
  publish = "frontend"
  command = "npm install"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# Route /api/v1/* to the API function (Netlify-only)
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Keep SPA/page redirects behavior compatible; specific redirects in frontend/_redirects
# still apply, but API is handled above.

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
