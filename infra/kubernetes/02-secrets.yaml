# ── Secrets (REPLACE EVERYTHING BEFORE PRODUCTION) ──────────────────────
#
# This file is a template. The values below are harmless placeholders so the
# cluster can come up end-to-end. Before pointing real users at it:
#
#   1. Generate a key:            openssl rand -hex 32
#   2. Edit this file (stringData) with the real values, or better:
#      kubectl -n babes-bookstore create secret generic babes-secrets \
#        --from-literal=secret-key="$(openssl rand -hex 32)" \
#        --from-literal=database-url="postgresql+asyncpg://...:5432/babes_bookstore?ssl=disable" \
#        --from-literal=sync-database-url="postgresql://...:5432/babes_bookstore?sslmode=disable" \
#        --from-literal=redis-url="redis://:REDIS_PASSWORD@babes-redis:6379/0"
#
#   For the self-contained Postgres in 04-postgres.yaml use:
#     postgresql+asyncpg://babes:CHANGE_ME@babes-postgres:5432/babes_bookstore?ssl=disable
#   (same user/password as the POSTGRES_PASSWORD value you set below); for a
#   managed database (RDS, Cloud SQL, Neon, Fly Postgres…) substitute its URL.
#
# stringData is written as plain text and stored base64 by the API server —
# the controller never keeps the template's plaintext around.
apiVersion: v1
kind: Secret
metadata:
  name: babes-secrets
  namespace: babes-bookstore
  labels:
    app.kubernetes.io/name: babes-bookstore
type: Opaque
stringData:
  # JWT signing key — MUST be >= 32 chars or the app refuses to boot
  # (the API fails fast in production rather than run insecure).
  secret-key: "CHANGE_ME_openssl_rand_hex_32"

  # Postgres connection strings (async for SQLAlchemy, sync for Alembic).
  database-url: "postgresql+asyncpg://babes:CHANGE_ME@babes-postgres:5432/babes_bookstore?ssl=disable"
  sync-database-url: "postgresql://babes:CHANGE_ME@babes-postgres:5432/babes_bookstore?sslmode=disable"

  # Celery broker / result backend.
  redis-url: "redis://:CHANGE_ME_REDIS@babes-redis:6379/0"

  # Self-contained Postgres credentials (only used by the bundled StatefulSet).
  postgres-user: "babes"
  postgres-password: "CHANGE_ME"
  postgres-db: "babes_bookstore"

  # Self-contained Redis password (only used by the bundled Redis).
  redis-password: "CHANGE_ME_REDIS"

  # Payment / storage / auth — set to "" until configured. See .env.example.
  stripe-secret-key: ""
  stripe-publishable-key: ""
  stripe-webhook-secret: ""
  r2-account-id: ""
  r2-access-key-id: ""
  r2-secret-access-key: ""
  r2-bucket-name: "babes-bookstore"
  google-client-id: ""
  google-client-secret: ""
  google-redirect-uri: ""
  sendgrid-api-key: ""
  bhl-api-key: ""