# Self-contained Redis (Celery broker + rate-limited result backend).
# Swap the REDIS_URL secret for a managed Redis (Upstash / ElastiCache /
# Fly Redis) at production scale — the API only reads the secret.
apiVersion: v1
kind: Service
metadata:
  name: babes-redis
  namespace: babes-bookstore
  labels:
    app.kubernetes.io/name: babes-bookstore
spec:
  selector:
    app: babes-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: babes-redis
  namespace: babes-bookstore
  labels:
    app.kubernetes.io/name: babes-bookstore
    app: babes-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: babes-redis
  template:
    metadata:
      labels:
        app: babes-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: babes-secrets, key: redis-password }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}