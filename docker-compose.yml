version: '3.8'

x-app-environment: &app_environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/babes_bookstore
  SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/babes_bookstore
  REDIS_URL: redis://redis:6379/0
  DEBUG: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: babes_bookstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      <<: *app_environment
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app worker -l info
    environment:
      <<: *app_environment
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery_beat:
    build: ./backend
    command: celery -A app.celery_app beat -l info
    environment:
      <<: *app_environment
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
